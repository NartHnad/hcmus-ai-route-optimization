<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Optimization Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
        .map-empty-message {
            position: absolute; z-index: 1000; top: 16px; left: 50%;
            transform: translateX(-50%); padding: 8px 12px; border-radius: 8px;
            color: #334155; background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.18); font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="empty-message" class="map-empty-message">Waiting for graph data...</div>

    <script>
        const DEFAULT_CENTER = [10.7741, 106.6782];
        const DEFAULT_ZOOM = 14;
        const GRID_CELL_DEG = 0.005; // ~500m cells, tuned for inner-city density
        const VIEWPORT_PAD = 0.5;    // 50% off-screen margin so short pans rarely add/remove layers

        const NODE_STYLE = {
            default: { radius: 8, color: '#2563eb', weight: 2, fillColor: '#60a5fa', fillOpacity: 0.9 },
            visit:   { radius: 10, color: '#ca8a04', weight: 3, fillColor: '#facc15', fillOpacity: 1.0 },
            path:    { radius: 11, color: '#15803d', weight: 3, fillColor: '#22c55e', fillOpacity: 1.0 },
        };
        const EDGE_STYLE = {
            default: { color: '#64748b', weight: 3, opacity: 0.65 },
            inspect: { color: '#f97316', weight: 5, opacity: 0.95 },
            path:    { color: '#16a34a', weight: 6, opacity: 1.0 },
        };

        // Canvas renderer (no per-marker/polyline DOM nodes) keeps thousands of
        // nodes/edges smooth while panning/zooming. Two panes enforce draw
        // order: edges must render below nodes regardless of add order.
        const map = L.map('map', { preferCanvas: true }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
        map.createPane('edgesPane'); map.getPane('edgesPane').style.zIndex = 400;
        map.createPane('nodesPane'); map.getPane('nodesPane').style.zIndex = 500;
        const edgeRenderer = L.canvas({ pane: 'edgesPane' });
        const nodeRenderer = L.canvas({ pane: 'nodesPane' });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);

        function edgeKey(from, to) { return `${from}->${to}`; }
        function cellKey(i, j) { return `${i}:${j}`; }
        function cellIndex(deg) { return Math.floor(deg / GRID_CELL_DEG); }

        // ------------------------------------------------------------------
        // Two parallel "kinds" — nodes and edges — share one architecture:
        //   index      : id/key -> raw data
        //   layers     : id/key -> Leaflet layer, created lazily on first
        //                viewport entry (never for areas the user never visits)
        //   styles     : id/key -> current highlight style (survives layers
        //                being evicted/recreated on viewport changes)
        //   grid       : cellKey -> Set of ids/keys inside that cell, built
        //                once in initMap so viewport refresh is O(view) not O(N)
        // make() builds the Leaflet layer; popupHtml() builds its popup lazily.
        // ------------------------------------------------------------------
        function makeKind(config) {
            return { index: {}, layers: {}, styles: {}, grid: {}, visible: new Set(), ...config };
        }

        const nodes = makeKind({
            defaultStyle: NODE_STYLE.default,
            make(node) {
                const layer = L.circleMarker(
                    node.latLng,
                    { pane: 'nodesPane', renderer: nodeRenderer, ...(nodes.styles[node.id] || NODE_STYLE.default) }
                );
                // Tooltip is eager (shows on hover, a frequent first interaction);
                // popup is lazy (built only if the user actually clicks).
                layer.bindTooltip(`${node.id} - ${node.name}`, { direction: 'top', offset: [0, -8] });
                bindLazyPopup(layer, () => `
                    <b>${node.name}</b><br>
                    ID: ${node.id}<br>
                    Type: ${node.type ?? 'intersection'}<br>
                    Lat/Lon: ${node.lat}, ${node.lon}
                `);
                return layer;
            },
            inView(viewBounds, node) { return viewBounds.contains(node.latLng); },
        });

        const edges = makeKind({
            defaultStyle: EDGE_STYLE.default,
            make(edge) {
                const from = nodes.index[edge.from], to = nodes.index[edge.to];
                if (!from || !to) return null;
                const layer = L.polyline(
                    [from.latLng, to.latLng],
                    { pane: 'edgesPane', renderer: edgeRenderer, ...(edges.styles[edgeKey(edge.from, edge.to)] || EDGE_STYLE.default) }
                );
                bindLazyPopup(layer, () => `
                    <b>${edge.from} → ${edge.to}</b><br>
                    Distance: ${edge.distance ?? '-'}<br>
                    Time: ${edge.travel_time ?? '-'}<br>
                    Road: ${edge.road_type ?? '-'}<br>
                    Congestion: ${edge.congestion ?? '-'}<br>
                    Risk: ${edge.risk ?? edge.flooding ?? '-'}<br>
                    ${edge.note ? `Note: ${edge.note}` : ''}
                `);
                return layer;
            },
            inView(viewBounds, edge) { return viewBounds.intersects(edge.bounds); },
        });

        function bindLazyPopup(layer, buildHtml) {
            layer.on('click', () => {
                if (!layer.getPopup()) layer.bindPopup(buildHtml());
                layer.openPopup();
            });
        }

        // Get (or lazily create) the Leaflet layer for an id/key, stamping it
        // with whatever style is currently recorded for it.
        function getLayer(kind, id) {
            if (kind.layers[id]) return kind.layers[id];
            const data = kind.index[id];
            if (!data) return null;
            const layer = kind.make(data);
            if (layer) kind.layers[id] = layer;
            return layer;
        }

        function setStyle(kindName, id, style) {
            const kind = kindName === 'node' ? nodes : edges;
            kind.styles[id] = style;
            const layer = kind.layers[id];
            if (layer) layer.setStyle(style);
            return layer;
        }

        // ------------------------------------------------------------------
        // Spatial grid: register each node/edge into every cell it touches
        // once at load time, so viewport refresh only scans cells overlapping
        // the current view instead of the whole graph.
        // ------------------------------------------------------------------
        function registerToGrid(kind, id, bounds) {
            const i1 = cellIndex(bounds.getSouth()), i2 = cellIndex(bounds.getNorth());
            const j1 = cellIndex(bounds.getWest()), j2 = cellIndex(bounds.getEast());
            for (let i = i1; i <= i2; i += 1) {
                for (let j = j1; j <= j2; j += 1) {
                    const key = cellKey(i, j);
                    (kind.grid[key] || (kind.grid[key] = new Set())).add(id);
                }
            }
        }

        function toggleVisibility(kind, id, layer, shouldShow) {
            const isVisible = kind.visible.has(id);
            if (shouldShow && !isVisible) { kind.visible.add(id); layer.addTo(map); }
            else if (!shouldShow && isVisible) { kind.visible.delete(id); map.removeLayer(layer); }
        }

        function candidatesInView(kind, viewBounds) {
            const candidates = new Set();
            const i1 = cellIndex(viewBounds.getSouth()), i2 = cellIndex(viewBounds.getNorth());
            const j1 = cellIndex(viewBounds.getWest()), j2 = cellIndex(viewBounds.getEast());
            for (let i = i1; i <= i2; i += 1) {
                for (let j = j1; j <= j2; j += 1) {
                    const cell = kind.grid[cellKey(i, j)];
                    if (cell) cell.forEach(id => candidates.add(id));
                }
            }
            return candidates;
        }

        function refreshVisibleLayers() {
            const viewBounds = map.getBounds().pad(VIEWPORT_PAD);
            for (const kind of [nodes, edges]) {
                candidatesInView(kind, viewBounds).forEach(id => {
                    const data = kind.index[id];
                    const layer = data && getLayer(kind, id);
                    if (layer) toggleVisibility(kind, id, layer, kind.inView(viewBounds, data));
                });
            }
        }
        // moveend fires only once a pan/zoom settles — a debounce would just add
        // latency. The VIEWPORT_PAD margin above is what actually prevents
        // add/remove thrash during small pans.
        map.on('moveend', refreshVisibleLayers);

        // ------------------------------------------------------------------
        // Public API: initMap / applyStep / resetMap
        // ------------------------------------------------------------------
        function normalizeInput(data) {
            if (typeof data === 'string') return JSON.parse(data);
            return data || { nodes: [], edges: [] };
        }

        function setEmptyMessage(visible, text = 'Waiting for graph data...') {
            const el = document.getElementById('empty-message');
            el.textContent = text;
            el.style.display = visible ? 'block' : 'none';
        }

        function resetKind(kind) {
            Object.values(kind.layers).forEach(layer => map.removeLayer(layer));
            kind.index = {}; kind.layers = {}; kind.styles = {}; kind.grid = {}; kind.visible = new Set();
        }

        function initMap(data) {
            map.invalidateSize();
            const graph = normalizeInput(data);
            resetKind(nodes);
            resetKind(edges);

            (graph.nodes || []).forEach(node => {
                // Cache LatLng once — reused by layer creation, containment
                // checks and fitBounds, avoiding repeated [lat, lon] arrays
                // in the pan/zoom hot path.
                node.latLng = L.latLng(node.lat, node.lon);
                nodes.index[node.id] = node;
                registerToGrid(nodes, node.id, L.latLngBounds(node.latLng, node.latLng));
            });

            (graph.edges || []).forEach(edge => {
                const from = nodes.index[edge.from], to = nodes.index[edge.to];
                if (!from || !to) return;
                // Cache bounds once — refreshVisibleLayers() intersects every
                // candidate edge on every viewport change, so a fresh
                // LatLngBounds per check was the hottest allocation here.
                edge.bounds = L.latLngBounds(from.latLng, to.latLng);
                const key = edgeKey(edge.from, edge.to);
                edges.index[key] = edge;
                registerToGrid(edges, key, edge.bounds);
            });

            if (Object.keys(nodes.index).length === 0) {
                setEmptyMessage(true, 'No graph nodes to display.');
                map.setView(DEFAULT_CENTER, DEFAULT_ZOOM);
                return;
            }

            setEmptyMessage(false);
            const bounds = L.latLngBounds(Object.values(nodes.index).map(n => n.latLng));
            map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
            // fitBounds triggers 'moveend' -> refreshVisibleLayers(); call once
            // more synchronously in case the view didn't actually change.
            refreshVisibleLayers();
        }

        const STEP_HANDLERS = {
            expand({ node: nodeId }) {
                if (!nodes.index[nodeId]) return;
                const layer = setStyle('node', nodeId, NODE_STYLE.visit);
                // Only pan when the expanded node is off-screen — animating a
                // pan on every step is the main source of lag.
                if (layer && !map.getBounds().contains(layer.getLatLng())) {
                    map.panTo(layer.getLatLng(), { animate: true, duration: 0.25 });
                }
            },
            discover({ from, to }) {
                setStyle('edge', edgeKey(from, to), EDGE_STYLE.inspect);
            },
            update({ from, to }) {
                setStyle('edge', edgeKey(from, to), EDGE_STYLE.path)?.bringToFront();
            },
            finish({ path = [] }) {
                path.forEach(nodeId => setStyle('node', nodeId, NODE_STYLE.path));
                for (let i = 0; i < path.length - 1; i += 1) {
                    setStyle('edge', edgeKey(path[i], path[i + 1]), EDGE_STYLE.path)?.bringToFront();
                }
            },
        };

        function applyStep(step) {
            const current = normalizeInput(step);
            STEP_HANDLERS[current?.type]?.(current);
        }

        function resetMap() {
            nodes.styles = {}; edges.styles = {};
            Object.values(nodes.layers).forEach(layer => layer.setStyle(NODE_STYLE.default));
            Object.values(edges.layers).forEach(layer => layer.setStyle(EDGE_STYLE.default));
        }
    </script>
</body>
</html>
