<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Optimization Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .map-empty-message {
            position: absolute;
            z-index: 1000;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            border-radius: 8px;
            color: #334155;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.18);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="empty-message" class="map-empty-message">Waiting for graph data...</div>

    <script>
        const DEFAULT_CENTER = [10.7741, 106.6782];
        const DEFAULT_ZOOM = 14;

        const NODE_STYLE = {
            default: { radius: 8, color: '#2563eb', weight: 2, fillColor: '#60a5fa', fillOpacity: 0.9 },
            visit: { radius: 10, color: '#ca8a04', weight: 3, fillColor: '#facc15', fillOpacity: 1.0 },
            path: { radius: 11, color: '#15803d', weight: 3, fillColor: '#22c55e', fillOpacity: 1.0 },
        
            start: {
                radius: 12,
                color: "#16a34a",
                weight: 4,
                fillColor: "#22c55e",
                fillOpacity: 1
            },
            goal: {
                radius: 12,
                color: "#dc2626",
                weight: 4,
                fillColor: "#ef4444",
                fillOpacity: 1
            },
        };

        const EDGE_STYLE = {
            default: { color: '#64748b', weight: 3, opacity: 0.65 },
            inspect: { color: '#f97316', weight: 5, opacity: 0.95 },
            path: { color: '#16a34a', weight: 6, opacity: 1.0 },
        };

        let map = L.map('map').setView(DEFAULT_CENTER, DEFAULT_ZOOM);
        let nodeLayers = {};
        let edgeLayers = {};
        let graphData = { nodes: [], edges: [] };

        // Control Node State: Start and Goal
        let currentStart = null;
        let currentGoal = null;

        let defaultTooltips = {};

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);

        function edgeKey(fromNode, toNode) {
            return `${fromNode}->${toNode}`;
        }

        function normalizeInput(data) {
            if (typeof data === 'string') {
                return JSON.parse(data);
            }
            return data || { nodes: [], edges: [] };
        }

        function clearGraphLayers() {
            Object.values(nodeLayers).forEach(layer => map.removeLayer(layer));
            Object.values(edgeLayers).forEach(layer => map.removeLayer(layer));
            nodeLayers = {};
            edgeLayers = {};
        }

        function nodeById(nodeId) {
            return graphData.nodes.find(node => node.id === nodeId);
        }

        function setEmptyMessage(visible, text = 'Waiting for graph data...') {
            const element = document.getElementById('empty-message');
            element.textContent = text;
            element.style.display = visible ? 'block' : 'none';
        }

        function initMap(data) {
            map.invalidateSize();

            graphData = normalizeInput(data);
            graphData.nodes = graphData.nodes || [];
            graphData.edges = graphData.edges || [];

            clearGraphLayers();

            if (graphData.nodes.length === 0) {
                setEmptyMessage(true, 'No graph nodes to display.');
                map.setView(DEFAULT_CENTER, DEFAULT_ZOOM);
                return;
            }

            setEmptyMessage(false);

            // Draw edges
            graphData.edges.forEach(edge => {
                const fromNode = nodeById(edge.from);
                const toNode = nodeById(edge.to);

                if (!fromNode || !toNode) return;

                const layer = L.polyline(
                    [[fromNode.lat, fromNode.lon], [toNode.lat, toNode.lon]],
                    EDGE_STYLE.default
                ).addTo(map);

                edgeLayers[edgeKey(edge.from, edge.to)] = layer;
            });

            // Draw nodes
            graphData.nodes.forEach(node => {
                const layer = L.circleMarker(
                    [node.lat, node.lon],
                    NODE_STYLE.default
                ).addTo(map);

                const tooltip = `${node.id} - ${node.name}`;
                defaultTooltips[node.id] = tooltip;

                layer.bindTooltip(tooltip, {
                    direction: 'top',
                    offset: [0, -8],
                });

                nodeLayers[node.id] = layer;
            });

            const bounds = L.latLngBounds(
                graphData.nodes.map(node => [node.lat, node.lon])
            );

            map.fitBounds(bounds, {
                padding: [40, 40],
                maxZoom: 16,
            });
        }

        function applyStep(step) {
            const currentStep = normalizeInput(step);
            if (!currentStep || !currentStep.type) {
                return;
            }

            if (currentStep.type === 'expand') {
                const layer = nodeLayers[currentStep.node];

                if (layer) {
                    layer.setStyle(NODE_STYLE.visit);

                    // Only pan the map if the node is outside the current view bounds
                    if (!map.getBounds().contains(layer.getLatLng())) {
                        map.panTo(layer.getLatLng(), {
                            animate: true,
                            duration: 0.25,
                        });
                    }
                }
                return;
            }

            if (currentStep.type === 'discover') {
                const layer = edgeLayers[edgeKey(currentStep.from, currentStep.to)];
                if (layer) {
                    layer.setStyle(EDGE_STYLE.inspect);
                }
                return;
            }

            if (currentStep.type === 'update') {
                const layer = edgeLayers[edgeKey(currentStep.from, currentStep.to)];
                if (layer) {
                    layer.setStyle(EDGE_STYLE.path);
                    layer.bringToFront();
                }
                return;
            }

            if (currentStep.type === 'finish') {
                const path = currentStep.path || [];
                path.forEach(nodeId => {
                    const nodeLayer = nodeLayers[nodeId];
                    if (nodeLayer) {
                        nodeLayer.setStyle(NODE_STYLE.path);
                    }
                });

                for (let i = 0; i < path.length - 1; i += 1) {
                    const layer = edgeLayers[edgeKey(path[i], path[i + 1])];
                    if (layer) {
                        layer.setStyle(EDGE_STYLE.path);
                        layer.bringToFront();
                    }
                }
            }
        }

        function resetMap() {
            Object.values(nodeLayers).forEach(layer => {
                layer.setStyle(NODE_STYLE.default);
            });

            Object.values(edgeLayers).forEach(layer => {
                layer.setStyle(EDGE_STYLE.default);
            });

            updateSelection({
                start: currentStart,
                goal: currentGoal,
            });
        }

        function updateSelection(selection) {
            selection = normalizeInput(selection);

            currentStart = selection.start;
            currentGoal = selection.goal;

            // Reset all nodes
            graphData.nodes.forEach(node => {
                const layer = nodeLayers[node.id];
                if (!layer) return;

                layer.setStyle(NODE_STYLE.default);

                layer.unbindTooltip();
                layer.bindTooltip(defaultTooltips[node.id], {
                    direction: 'top',
                    offset: [0, -8],
                });
            });

            // Start
            if (currentStart && nodeLayers[currentStart]) {
                nodeLayers[currentStart].setStyle(NODE_STYLE.start);

                nodeLayers[currentStart].unbindTooltip();
                nodeLayers[currentStart].bindTooltip(
                    `START<br>${defaultTooltips[currentStart]}`,
                    {
                        direction: 'top',
                        offset: [0, -8],
                    }
                );
            }

            // Goal
            if (currentGoal && nodeLayers[currentGoal]) {
                nodeLayers[currentGoal].setStyle(NODE_STYLE.goal);

                nodeLayers[currentGoal].unbindTooltip();
                nodeLayers[currentGoal].bindTooltip(
                    `GOAL<br>${defaultTooltips[currentGoal]}`,
                    {
                        direction: 'top',
                        offset: [0, -8],
                    }
                );
            }
        }
    </script>
</body>
</html>
